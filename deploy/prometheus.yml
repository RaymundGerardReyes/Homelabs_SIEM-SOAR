global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ==============================================================================
# 1. 🌐 COMPONENT PLACEMENT & GLOBAL WORKFLOW TRACE
#    - Infrastructure Scraper: Operates inside the isolated Docker network bridge.
#    - Upstream: Prometheus TSDB | Downstream: Go Core / cAdvisor Exporters
# 2. 🛡️ LOGICAL INTENT & SYSTEM RESPONSIBILITY
#    - Pulls telemetry from internal microservices to construct Grafana alerting
#      dashboards. Specifically tracks GC heap exhaustion and goroutine leaks.
# 3. 🚨 INFRASTRUCTURE GUARDRAILS & RESOURCE CONSTRAINTS
#    - Security: Scrapes are performed entirely behind the Nginx reverse proxy.
#      The `/metrics` endpoint must never be exposed to public egress `0.0.0.0:80`.
# 4. 🔗 CROSS-MODULE INTERFACE & CONTRACT BOUNDARIES
#    - Interfaces with `core-ingest:8080` and `cadvisor:8080` internally.
# 5. ☣️ FAILURE DOMAINS & RESILIENCE STATE
#    - Failure Mode: Target containers OOM kill or network partitions.
#    - Fallback State: Target marked as "DOWN", triggering secondary AlertManager pagers.
# ==============================================================================
scrape_configs:
  - job_name: 'tier_p2_infrastructure'
    # Scrape Node Exporter over the private Tailscale/VPC mesh network.
    # Replace '100.x.y.z' with actual Tailscale/VPC IPs.
    static_configs:
      - targets: ['100.64.0.2:9100', '100.64.0.3:9100']
        labels:
          tier: 'P2_Droplet'

  - job_name: 'soc_core_metrics'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['100.64.0.2:2112']
        labels:
          tier: 'P2_Droplet'
          service: 'core-ingest'

  - job_name: 'soc_backend_fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['100.64.0.3:8000']
        labels:
          tier: 'P2_Droplet'
          service: 'soc-backend'

  - job_name: 'tier_p1_paas_pushgateway'
    # Pushgateway for receiving metrics from Tier P1 PaaS platforms (e.g. App Platform) 
    # that cannot be scraped directly. Metrics pushed here by GitHub Actions cron jobs.
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          tier: 'P1_PaaS'
