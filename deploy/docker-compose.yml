# ==============================================================================
# 1. 🌐 COMPONENT PLACEMENT & GLOBAL WORKFLOW TRACE
#    - Orchestration Engine: Assembles and links independent service components.
#    - Upstream: System Host Engine OS Environment | Downstream: Public Access Nodes
# ==============================================================================
networks:
  internal-mesh:
    driver: bridge
    internal: true # Air-gapped network segment protecting databases from public access
  public-ingress:
    driver: bridge
volumes:
  clickhouse_data:
  langgraph_state:
  postgres_data:
services:
  # ============================================================================
  # 1. CLOUDFLARE TUNNEL BROKER (Secure Outbound Edge Connection)
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: soc-cloudflared-edge
    networks:
      - public-ingress
    user: "65532:65532" # Enforces strict non-root execution inside the container container
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - soc-frontend
    command: tunnel --no-autoupdate run
    restart: unless-stopped

  # ============================================================================
  # 2. EDGE INTERCEPTOR & APPLICATION FIREWALL (Nginx Proxy)
  # ============================================================================
  soc-frontend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.react
    container_name: soc-nginx-proxy
    networks:
      public-ingress:
        aliases:
          - soc-nginx-proxy
      internal-mesh:
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RESOLVER_IP=127.0.0.11
    depends_on:
      - core-ingest
      - soc-backend
    restart: unless-stopped

  # ============================================================================
  # 3. GO STREAM INGESTION ENGINE
  # ============================================================================
  core-ingest:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.go
    container_name: soc-go-ingest-core
    networks:
      - internal-mesh
      - public-ingress # Bound to public ingress strictly for port 8080 routing routes
    expose:
      - "9090" # Internal gRPC socket connection channel
      - "8080" # Exposed endpoint receiving unbuffered HTTP webhook packets
    env_file: .env
    environment:
      - DATABASE_URL=${POSTGRES_CONNECTION_STRING}
      - CLICKHOUSE_ADDRESS=clickhouse-server:9000
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse-server:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # 4. PYTHON AI AGENT ORCHESTRATION LAYER (FastAPI / LiteLLM Router)
  # ============================================================================
  soc-backend:
    build:
      context: ../
      dockerfile: deploy/Dockerfile.python
    container_name: soc-python-ai-backend
    networks:
      - internal-mesh
      - public-ingress
    expose:
      - "8000"
    volumes:
      - langgraph_state:/app/state
    env_file: .env
    environment:
      - DATABASE_URL=${POSTGRES_CONNECTION_STRING}
      - GO_CORE_URL=${GO_CORE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      core-ingest:
        condition: service_started
    restart: unless-stopped

  # ============================================================================
  # 5. DATA LAKE ENGINE (ClickHouse Columnar Storage)
  # ============================================================================
  clickhouse-server:
    image: clickhouse/clickhouse-server:latest
    container_name: soc-clickhouse-analytics
    env_file: .env
    networks:
      - internal-mesh
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # ============================================================================
  # 6. TRANSACTIONAL STATE ENGINE (PostgreSQL for Multi-Tenant Data)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres-state
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-mesh
