worker_processes auto;

events {
    worker_connections 4096; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    # CRITICAL: Must be > 90s to prevent Cloudflare Tunnel TCP RST race conditions (502 errors)
    keepalive_timeout 100s;

    # Gzip configuration (Disabled inside the high-throughput ingestion lanes)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    limit_req_zone $binary_remote_addr zone=frontend_zone:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ingest_zone:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server_tokens off;
    client_max_body_size 10m;

    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format structured
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'correlationId="$correlation_id"';

    access_log /var/log/nginx/access.log structured;
    error_log  /var/log/nginx/error.log  warn;

    # ==============================================================================
    # 🛡️ SOFTWARE-DEFINED WAF INTENT & RATELIMIT ENGINE
    # ==============================================================================
    # 1. Blocks malformed cross-site scripting (XSS) via strict Regex filtering.
    # 2. Blocks SQL Injection (SQLi) patterns natively without external software.
    # 3. Drops unapproved HTTP methods directly at the edge socket layer.
    map $request_uri $waf_sql_xss {
        default 0;
        ~*(%3C|<)script(%3E|>) 1;
        ~*(?:union\s+all\s+select|drop\s+table|insert\s+into) 1;
        ~*(?:\.\./|\.\.\x5c) 1;
        ~*\.(env|git) 1;
        ~*wp-admin 1;
    }

    # ==============================================================================
    # 1. 🌐 COMPONENT PLACEMENT & TOPOLOGICAL CROSS-ROUTING
    #    - Step 0 of 5: Base infrastructure orchestration and network namespace bootstrapping.
    #    - Upstream: N/A | Downstream: Nginx Configuration Engine
    # 🛡️ 2. LOGICAL INTENT & RUNTIME PARITY GUARDRAILS
    #    - Uses an internal DNS resolver with a 30s cache to prevent per-packet UDP lookups,
    #      while maintaining persistent TCP socket pools for ultra-low latency routing.
    # 🚨 3. ORCHESTRATION DEPENDENCY SINK & INITIALIZATION TIMING
    #    - `max_fails=3 fail_timeout=10s` allows Nginx to gracefully boot even if the
    #      backend containers are still initializing their databases.
    # 🔗 4. CROSS-MODULE INTERFACE & TLS CONTRACT BOUNDARIES
    #    - Resolves container hostnames dynamically across Docker's built-in DNS (127.0.0.11).
    # ☣️ 5. CASCADING FAILURE MODE & DETAILED RESILIENCE STATE
    #    - Failure Mode: Upstream target drops offline.
    #    - Resilience State: Nginx temporarily stops routing to the failed node (max_fails)
    #      and caches the DNS resolution to prevent UDP socket exhaustion.
    # ==============================================================================
    resolver 127.0.0.11 valid=30s;

    # ==============================================================================
    # DYNAMIC DNS RESOLUTION FOR HORIZONTAL SCALING
    # In NGINX OSS, static upstream blocks cache DNS resolution at startup. By
    # removing the upstream block and utilizing a variable in proxy_pass, Nginx
    # is forced to dynamically re-resolve the IPs of new replicas via the Docker DNS.
    # ==============================================================================

    # ───────────────────────────────────────────────────────────────
    # PUBLIC TELEMETRY INGESTION GATEWAY (CLOUDFLARE EDGE)
    # ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name ingest.yourdomain.com;

        # ENFORCE WAF FAIL-CLOSED POSTURE
        if ($waf_sql_xss) { return 403; }
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }

        # STRICT DEVSECOPS SECURITY HEADERS
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ==============================================================================
        # 1. 🌐 COMPONENT PLACEMENT & GLOBAL WORKFLOW TRACE
        #    - High-Velocity Ingress: The edge gateway for external telemetry logs.
        #    - Upstream: Malicious/Compromised Network Agents | Downstream: Go Ingestion Core
        # 2. 🛡️ LOGICAL INTENT & SYSTEM RESPONSIBILITY
        #    - Implements NF3 compliant load-shedding and layer-7 brute-force protection
        #      before passing traffic to the highly concurrent Go processing engine.
        # 3. 🚨 INFRASTRUCTURE GUARDRAILS & RESOURCE CONSTRAINTS
        #    - Rate Limiting: `limit_req zone=api_general burst=50 nodelay;` strictly
        #      prevents DDOS bursts. Anything exceeding this generates HTTP 429.
        # 4. 🔗 CROSS-MODULE INTERFACE & CONTRACT BOUNDARIES
        #    - Strips SSL overhead, passing pure HTTP/1.1 traffic to `core-ingest:8080`.
        # 5. ☣️ FAILURE DOMAINS & RESILIENCE STATE
        #    - Failure Mode: Sustained volumetric DDOS attack over HTTP.
        #    - Fallback State: Nginx drops connections instantly (429), preserving
        #      backend CPU for existing critical analysis.
        # ==============================================================================
        location ^~ /api/v1/agent/push {
            limit_req zone=ingest_zone burst=10 nodelay;
            limit_req_status 429;
            gzip off; 

            set $go_ingest http://core-ingest:8080;
            proxy_pass $go_ingest;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; 
            
            # CRITICAL: Disable request and response buffering for real-time telemetry streaming
            proxy_buffering off;
            proxy_request_buffering off;

            # Inject the real public IP of the remote cloud container into the transaction stream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header X-Correlation-ID $correlation_id;
            
            # Extend timeouts to handle large security log transfers from public networks
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # Secure, isolated route inside deploy/nginx.conf for Database Tracking
        location ^~ /api/v1/database/webhook {
            # Restrict access exclusively to the public ingestion domain
            allow all;
            
            set $go_ingest http://core-ingest:8080;
            proxy_pass $go_ingest;
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Inject Cloudflare edge-validated real visitor IP configurations
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header X-Correlation-ID $correlation_id;
            
            # Enforce strict maximum timeout parameters for persistent streams
            proxy_read_timeout 60s;
        }

        # NETWORK ACCESS ISOLATION: Block administrative routes on public domain
        location / {
            return 403;
        }
    }

    # ───────────────────────────────────────────────────────────────
    # LOCAL ADMINISTRATION DASHBOARD (INTERNAL NETWORK ONLY)
    # ───────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name admin.yourdomain.com localhost _;

        # ENFORCE WAF FAIL-CLOSED POSTURE
        if ($waf_sql_xss) { return 403; }
        if ($request_method !~ ^(GET|POST|OPTIONS|HEAD)$) { return 405; }

        # Trust Docker internal proxy headers
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;

        limit_conn conn_limit 20;

        # STRICT DEVSECOPS SECURITY HEADERS
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self' https: data: blob:; connect-src 'self' ws: wss: https: http: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: https:;" always;

        root /usr/share/nginx/html;
        index index.html;

        # MODULE 1A: SERVE STATIC REACT BUNDLE ASSETS
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # MODULE 1B: SERVE STATIC REACT DASHBOARD HTML
        location / {
            limit_req zone=frontend_zone burst=50 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.html;
        }


        # MODULE 2: HIGH-SECURITY RATE-LIMITED WEBHOOK INGESTION
        location /ingest/ {
            limit_req zone=ingest_zone burst=10 nodelay;
            limit_req_status 429;
            
            set $go_ingest http://core-ingest:8080;
            proxy_pass $go_ingest;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header Connection "";
        }



        # MODULE 3: HIGH-SECURITY RATE-LIMITED AUTH REST INTERFACE
        location /api/auth/ {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;

            set $python_backend http://soc-backend:8000;
            proxy_pass $python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # MODULE 4: HIGH-SECURITY RATE-LIMITED STANDARD REST INTERFACE
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            set $python_backend http://soc-backend:8000;
            proxy_pass $python_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            # Reset Connection header to defaults
            proxy_set_header Connection "";
            # Extended timeout — AI triage calls can take >60s for LLM inference
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # ==============================================================================
        # 1. 🌐 COMPONENT PLACEMENT & GLOBAL WORKFLOW TRACE
        #    - SSL Termination Proxy Edge: The WebSockets Upgrade Gateway.
        #    - Upstream: External React Clients | Downstream: FastAPI ASGI Workers
        # 2. 🛡️ LOGICAL INTENT & SYSTEM RESPONSIBILITY
        #    - Intercepts SSE/WS requests and executes an HTTP `Upgrade` to transition
        #      from stateless REST to a stateful, persistent TCP tunnel.
        # 3. 🚨 INFRASTRUCTURE GUARDRAILS & RESOURCE CONSTRAINTS
        #    - Socket Saturation: Heavy usage holds open Nginx `worker_connections`.
        #      The `worker_connections 4096` ceiling limits total active SIEM analysts
        #      to 4,096 concurrent sessions before dropping traffic.
        #    - Offloaded Buffering: `proxy_buffering off;` is CRITICAL. Without it,
        #      Nginx will cache live SIEM events until a buffer fills, destroying real-time UX.
        # 4. 🔗 CROSS-MODULE INTERFACE & CONTRACT BOUNDARIES
        #    - Modifies the protocol via HTTP headers: `Upgrade` and `Connection`.
        # 5. ☣️ FAILURE DOMAINS & RESILIENCE STATE
        #    - Failure Mode: The upstream FastAPI ASGI server crashes or restarts.
        #    - Fallback State: Tunnel collapses. React UI hook `useInvestigationStream`
        #      must catch the closure and execute reconnection logic.
        # ==============================================================================
        # MODULE 5: UNTHROTTLED BYPASS FOR REAL-TIME LIVE DATA CHANNELS (WEBSOCKETS)
        # Covers both investigation streams AND the EDR live-tail WebSocket endpoint.
        location ~ ^/api/(investigations/.*/stream|ws/.*)$ {
            set $python_backend http://soc-backend:8000;
            proxy_pass $python_backend;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location /health {
            set $python_backend http://soc-backend:8000;
            proxy_pass $python_backend/api/health;
        }
    }
}
