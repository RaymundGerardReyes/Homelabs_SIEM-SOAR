name: Build and Deploy (PaaS-First Orchestration)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push soc-frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: deploy/Dockerfile.react
          push: true
          tags: ghcr.io/${{ github.repository }}/soc-frontend:latest

      - name: Build and Push core-ingest
        uses: docker/build-push-action@v4
        with:
          context: .
          file: deploy/Dockerfile.go
          push: true
          tags: ghcr.io/${{ github.repository }}/core-ingest:latest

      - name: Build and Push soc-backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: deploy/Dockerfile.python
          push: true
          tags: ghcr.io/${{ github.repository }}/soc-backend:latest

  deploy-tier-p1:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to PaaS (e.g. DO App Platform)
        # Example PaaS integration using DO CLI
        run: |
          echo "Triggering PaaS Platform Deployment via API..."
          # doctl apps create --spec .do/app.yaml
        env:
          DO_PAT: ${{ secrets.DO_PAT }}

  deploy-tier-p2:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Tier P2 Droplets via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /opt/soc
            # Inject Secrets from GitHub Actions directly to .env
            echo "POSTGRES_CONNECTION_STRING=${{ secrets.POSTGRES_CONNECTION_STRING }}" > deploy/.env
            echo "INTERNAL_SERVICE_KEY=${{ secrets.INTERNAL_SERVICE_KEY }}" >> deploy/.env
            
            # Pull latest images and restart containers via Docker Compose
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
