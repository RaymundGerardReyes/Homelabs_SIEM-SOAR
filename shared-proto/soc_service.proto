syntax = "proto3";

package pb;
option go_package = "core-ingest/pb";

import "google/protobuf/timestamp.proto";

// The Ingestion Core Service manages type-safe data pipelines between Go and Python Agent layers.
service IngestionCoreService {
    
    // FETCH LOG CONTEXT (FIXED: Uses Server-to-Client Streaming to handle massive logs without RAM bloat)
    rpc FetchAlertContext(LogContextRequest) returns (stream LogContextResponse);
    
    // CONTAINMENT CALLS (FIXED: Asynchronous, audited, and strictly validated)
    rpc PushBlockDirective(BlockDirectiveRequest) returns (BlockDirectiveResponse);
}

// ───────────────────────────────────────────────────────────────
// DATA MODEL CORRECTIONS FOR HIGH-THROUGHPUT SIEM SCANS
// ───────────────────────────────────────────────────────────────
message LogContextRequest {
    repeated string evidence_ids = 1;
    int32 max_records_limit = 2; // Prevent agents from accidentally requesting a 10GB trace
}

// Structuring individual logs natively eliminates heavy JSON parsing latencies
message SecurityEventDetail {
    string event_id = 1;
    google.protobuf.Timestamp timestamp = 2;
    string source_ip = 3;
    string principal_user = 4;
    string action_executed = 5;
    uint32 risk_score = 6;
}

message LogContextResponse {
    string status = 1;
    int32 current_batch_index = 2;
    // FIXED: Embedding native messages completely eliminates JSON string conversion overhead
    repeated SecurityEventDetail events = 3; 
}

// ───────────────────────────────────────────────────────────────
// DATA MODEL CORRECTIONS FOR AUDITING & POLICY COMPLIANCE
// ───────────────────────────────────────────────────────────────
message BlockDirectiveRequest {
    string ip_address = 1;
    string justification = 2;
    
    // FIXED: Mandatory Audit Context Fields for FR7 Enforcement
    string actor_id = 3;         // Track precisely which Agent (e.g., 'ResponseAgent') triggered the command
    string session_id = 4;       // Tie the block directly back to the active LangGraph investigation ID
    string authorization_jwt = 5; // User authentication token used to verify RBAC down at the Go layer
}

message BlockDirectiveResponse {
    bool success = 1;
    string log_id = 2;
    google.protobuf.Timestamp executed_at = 3;
}
